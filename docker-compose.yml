# Local development services for FitIT.
# Start:  docker compose up -d
# Stop:   docker compose down
# Values like ${POSTGRES_PASSWORD} are read from the .env file next to this one.

services:
  # PostgreSQL database
  db:
    image: postgres:18
    container_name: fitit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fitit}
    ports:
      - "5432:5432"
    volumes:
      # Keeps your data when the container is stopped or recreated
      - db-data:/var/lib/postgresql

  # pgAdmin (visual database tool) at http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4
    container_name: fitit-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db-data:
